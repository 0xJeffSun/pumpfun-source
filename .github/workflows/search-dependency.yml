name: Search dependency commit for byte-identical build
on:
  workflow_dispatch:
    inputs:
      dependency:
        description: which dependency to search
        type: choice
        default: both
        options: [both, associated_token, token_metadata]

permissions:
  contents: read

jobs:
  associated-token:
    if: inputs.dependency == 'associated_token' || inputs.dependency == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Search ATA v1.1.x (+ current pin v1.1.0 control)
        run: |
          python3 scripts/search_dependency_commit.py --dependency associated_token --output work/ata-search --commits \
            f5ce86d43dd31ddefb96d4e8cdd67dd073dc5dca \
            1420b559bb5908898dd963096bd73987fbec7094 \
            979fdc8b7bc1486c9e0a144b791a324cb13a09b1 \
            73673b6b306ad03086e1cb4a2ec87d220686c306
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ata-search
          path: |
            work/ata-search/search-report.json
            work/ata-search/MATCH-*.so
          if-no-files-found: warn
          retention-days: 30

  token-metadata:
    if: inputs.dependency == 'token_metadata' || inputs.dependency == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Search Metaplex mainnet-beta proposals (+ current pin 17e99434 control)
        run: |
          python3 scripts/search_dependency_commit.py --dependency token_metadata --output work/metaplex-search --commits \
            17e99434af5ead3e989c08f32af33609821d0bc0 \
            7c95f9948d7fed8db9947188b8040f0d560ac2d3 \
            7c1c905f324462af7bb3850c75aa6724f8689a74 \
            4e5bcca44000f151fe64682826bbe2eb61cd7b87 \
            5cd48b4aa05786ad16219fdfab3c58044db8afac \
            5beae6c81a450c6af17180bf7ad4c2d98807c99d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metaplex-search
          path: |
            work/metaplex-search/search-report.json
            work/metaplex-search/MATCH-*.so
          if-no-files-found: warn
          retention-days: 30
