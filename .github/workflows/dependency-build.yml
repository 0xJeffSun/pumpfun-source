name: Rebuild pinned token dependencies
on:
  workflow_dispatch:
    inputs:
      dependency:
        description: Captured token dependency to reproduce
        required: true
        default: spl_token_2022
        type: choice
        options:
          - spl_token
          - spl_token_2022
          - associated_token
          - token_metadata
          - both
permissions:
  contents: read
jobs:
  spl-token:
    if: inputs.dependency == 'spl_token' || inputs.dependency == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: solana-program/token
          ref: a94dd19750dc3b2409f73e15bb74754935b2a489
          path: work/token-source
          persist-credentials: false
      - name: Rebuild using pinned verified image and compare complete capture
        run: python3 scripts/pump_build_token_dependency.py --dependency spl_token --source work/token-source --output work/token-rebuild
      - name: Preserve source manifest, build logs, generated ELF and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-rebuild-${{ github.run_id }}
          path: work/token-rebuild
          if-no-files-found: error
          retention-days: 30
  token-2022:
    if: inputs.dependency == 'spl_token_2022' || inputs.dependency == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: solana-program/token-2022
          ref: 8867f751c0f69367ba03af4f85510b5611989491
          path: work/token-2022-source
          persist-credentials: false
      - name: Rebuild with source-pinned CLI4.0.1 image and compare capture allocation
        run: python3 scripts/pump_build_token_dependency.py --dependency spl_token_2022 --source work/token-2022-source --output work/token-2022-rebuild
      - name: Preserve source manifest, build logs, generated ELF and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-2022-rebuild-${{ github.run_id }}
          path: work/token-2022-rebuild
          if-no-files-found: error
          retention-days: 30
  associated-token:
    if: inputs.dependency == 'associated_token'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: solana-labs/solana-program-library
          ref: e10776ee2910eef96d7b5fd2716b2805a2fd42e6
          path: work/ata-source
          persist-credentials: false
      - name: Rebuild release-attributed ATA source using pinned CLI1.10.33 image
        run: python3 scripts/pump_build_token_dependency.py --dependency associated_token --source work/ata-source --output work/ata-rebuild
      - name: Preserve source manifest, build logs, generated ELF and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ata-rebuild-${{ github.run_id }}
          path: work/ata-rebuild
          if-no-files-found: error
          retention-days: 30
  token-metadata:
    if: inputs.dependency == 'token_metadata'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metaplex-foundation/mpl-token-metadata
          ref: 7c1c905f324462af7bb3850c75aa6724f8689a74
          path: work/metaplex-source
          persist-credentials: false
      - name: Build official-source candidate using pinned CLI1.16.25 image
        run: python3 scripts/pump_build_token_dependency.py --dependency token_metadata --source work/metaplex-source --output work/metaplex-rebuild
      - name: Preserve candidate source, logs, generated ELF and honest comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaplex-rebuild-${{ github.run_id }}
          path: work/metaplex-rebuild
          if-no-files-found: error
          retention-days: 30
