name: Metaplex tail guard source trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metaplex-foundation/mpl-token-metadata
          ref: 17e99434af5ead3e989c08f32af33609821d0bc0
          path: work/metaplex-tail-source
          persist-credentials: false
      - name: Build error-first tail guard with pinned recipe
        run: >-
          python3 repro/pump/metaplex-tail-guard-source-recovery/build.py
          --dependency token_metadata --metaplex-tail-guard-recovery
          --source work/metaplex-tail-source --output work/metaplex-tail-build
      - name: Retain source manifests, build log and complete comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaplex-tail-build-${{ github.run_id }}
          path: work/metaplex-tail-build
          if-no-files-found: error
          retention-days: 30
