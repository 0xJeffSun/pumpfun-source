name: Qualify Pump frontier on pinned macOS profile
on:
  push:
    branches: [research/pump-macos-frontier798-qualification]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pump-macos-v144-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts
            programs/pump
            evidence/original/pump
            repro/pump/main-contract-round37-20261027
            research/pump-round37-trade-add-site-20261027
            research/pump-round37-sell-v2-fee-errors-20261028
            research/pump-macos-frontier798-qualification-20261028
      - name: Install isolated comparison dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/pump-qualification-python"
          "$RUNNER_TEMP/pump-qualification-python/bin/pip" install pyelftools==0.32
          printf '%s\n' "$RUNNER_TEMP/pump-qualification-python/bin" >> "$GITHUB_PATH"
      - name: Reproduce profile, canonical checkpoint and frozen frontier
        run: python3 -B scripts/pump_macos_frontier_qualification.py
      - name: Retain actual compiler inputs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-macos-v144-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-macos-qualification/evidence
          if-no-files-found: error
          retention-days: 30
  runtime:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            programs/pump
            evidence/original
            evidence/dependencies
            evidence/upstream
            research/imported-lab/analysis/pump_fun
            repro/pump/native-curve-partial-fortyeight
            repro/pump/tokenkeg-two-curve-fortyeight
      - name: Install isolated runtime dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/pump-runtime-python"
          "$RUNNER_TEMP/pump-runtime-python/bin/pip" install solders==0.27.1 pyelftools==0.32
          printf '%s\n' "$RUNNER_TEMP/pump-runtime-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pump-macos-v144-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-macos-frontier-inputs
      - name: Replay this exact native artifact
        run: python3 -B scripts/pump_replay_macos_frontier.py
      - name: Retain actual runtime reports and loader receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-frontier-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-macos-frontier-runtime/evidence
          if-no-files-found: error
          retention-days: 30
