name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_evidence.py
      - run: python scripts/test_tooling.py
      - run: python scripts/verify_recovered_builds.py
      - run: python scripts/pump_verify_dependencies.py
      - run: pip install -r requirements.txt
      - run: python scripts/local_validation.py
      - run: git diff --exit-code -- audit/local-validation.json
      - run: mkdir -p work && rustc --edition 2021 -O programs/pump-fees/recovered/fee_selection_host.rs -o work/fee-selector-host
      - run: python scripts/validate_fee_selection.py --host work/fee-selector-host --output work/fee-selector-validation.json
      - run: python scripts/build_quote_host.py --output work/quote-host
      - run: python scripts/validate_quote_fees.py --host work/quote-host/quote-fees-host --output work/quote-validation.json
      - run: python scripts/validate_fee_handlers.py --candidate repro/pump_fees/query-candidate.so --output work/fee-handlers.json
      - run: python scripts/pump_validate_admin.py --candidate repro/pump/admin-candidate.so --output work/pump-admin.json
      - run: python scripts/pump_amm_admin_differential.py --candidate repro/pump_amm/admin-five/pump_amm_recovered.so --output work/pump-amm-admin.json
      - run: python scripts/mayhem_validate_admin.py --candidate repro/mayhem/mayhem_recovered.so --output work/mayhem-admin.json
      - run: git clone https://github.com/pump-fun/pump-public-docs.git work/pump-public-docs
      - run: python scripts/verify_imported_lab.py --docs-checkout work/pump-public-docs --output work/lab-saved-verification
