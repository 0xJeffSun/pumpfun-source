name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_evidence.py
      - run: python scripts/test_tooling.py
      - run: pip install -r requirements.txt
      - run: python scripts/local_validation.py
      - run: git diff --exit-code -- audit/local-validation.json
