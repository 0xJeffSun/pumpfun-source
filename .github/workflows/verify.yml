name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: evidence
            commands: |
              python scripts/verify_evidence.py
              python scripts/test_tooling.py
              python scripts/test_build_source_manifest.py
              python scripts/test_core_linux_v144_retention.py
              python repro/pump_fees/initializer-inline-runtime/verify.py
              python scripts/verify_recovered_builds.py
              python -B repro/pump/wide-runtime-attribution/verify.py --repo .
              python scripts/pump_verify_dependencies.py
              python repro/pump/metaplex-candidate-build-11/verify.py
              python repro/pump/mayhem-virtual-params-static/verify.py
              python scripts/local_validation.py
              git diff --exit-code -- audit/local-validation.json
          - suite: host-fragments
            commands: |
              mkdir -p work && rustc --edition 2021 -O programs/pump-fees/recovered/fee_selection_host.rs -o work/fee-selector-host
              python scripts/validate_fee_selection.py --host work/fee-selector-host --output work/fee-selector-validation.json
              python scripts/build_quote_host.py --output work/quote-host
              python scripts/validate_quote_fees.py --host work/quote-host/quote-fees-host --output work/quote-validation.json
              rustc --edition=2021 -O programs/pump/recovered/constant_product_host.rs -o work/pump-math-host
              python scripts/pump_validate_constant_product.py --host work/pump-math-host --output work/pump-math.json
              rustc --edition=2021 -O programs/pump/recovered/sell_accounting_host.rs -o work/pump-sell-accounting-host
              python scripts/pump_validate_sell_accounting.py --host work/pump-sell-accounting-host --output work/pump-sell-accounting.json
          - suite: fees
            commands: |
              python scripts/fees_validate_all.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fee-handlers.json
              python scripts/fees_donation_sequence.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/donation-sequence.json
              python repro/pump_fees/initializer-history/replay_history.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-init-history.json
              python repro/pump_fees/initializer-history/negative_differential.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-init-rejections.json
              python scripts/fees_error_messages_differential.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-error-messages.json
              python scripts/fees_external_codec_differential.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-codec-rejections.json
              python repro/pump_fees/fee-config-serialization-v144/compared_values.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-compared-values.json
              python repro/pump_fees/fee-config-serialization-v144/authority_logs.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-authority-logs.json
              python repro/pump_fees/fee-config-serialization-v144/signed_transfers.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-signed-transfers.json
              python repro/pump_fees/fee-config-serialization-v144/serialization_error.py --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --output work/fees-serialization-error.json
              python repro/pump_fees/fee-config-serialization-v144/verify_publication.py
              python -B repro/pump_fees/withdraw-owned-error-main-v144/verify.py --current-main .
              python -B scripts/prepare_fees_withdraw_runtime.py --output work/fees-focused-current
              python -B work/fees-focused-current/validation-layer/harness/fees_donation_business_differential.py --repo . --source-root repro/pump_fees/withdraw-owned-error-v144/source --candidate repro/pump_fees/withdraw-owned-error-main-v144/main/candidate.so --candidate-sha256 76b027c2f4393912e274c1f05b21de77743e18116969a3546ccf8718c2cfa7f7 --build-record repro/pump_fees/withdraw-owned-error-main-v144/main/build-comparison.json --output work/fees-donation-focused20.json
              python -B repro/pump_fees/withdraw-owned-error-v144/verify.py --runtime-signatures
              python scripts/verify_current_bindings.py fees
          - suite: pump-0
            commands: |
              python repro/pump/merged-prs-20261025/verify.py
              python repro/pump/merged-prs-20261025/replay.py --group 0 --output work/merged-replay
          - suite: pump-1
            commands: |
              python repro/pump/merged-prs-20261025/verify.py
              python repro/pump/merged-prs-20261025/replay.py --group 1 --output work/merged-replay
          - suite: pump-2
            commands: |
              python repro/pump/merged-prs-20261025/verify.py
              python repro/pump/merged-prs-20261025/replay.py --group 2 --output work/merged-replay
          - suite: pump-3
            commands: |
              python repro/pump/merged-prs-20261025/verify.py
              python repro/pump/merged-prs-20261025/replay.py --group 3 --output work/merged-replay
          - suite: pump-4
            commands: |
              python repro/pump/merged-prs-20261025/verify.py
              python repro/pump/merged-prs-20261025/replay.py --group 4 --output work/merged-replay
              python repro/pump/merged-prs-20261025/replay_extended.py --output work/merged-extended
              python repro/pump_fees/fresh-init-liveness/verify.py
              python repro/pump/mayhem-signer-boundary/mainnet-trade-cpi/verify.py
              python repro/pump/merged-prs-20261025/run_suite.py scripts/pump_set_mayhem_params_signer_boundary.py --output work/mayhem-direct-boundary.json
              git fetch --no-tags --unshallow --filter=blob:none origin
              python scripts/verify_pump_source_path_remap.py
          - suite: pump-amm
            commands: |
              python scripts/pump_amm_admin_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-admin.json
              python scripts/pump_amm_buyback_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-buyback.json
              python scripts/pump_amm_fee_config_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-fee_config.json
              python scripts/pump_amm_resize_differential.py --creator --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-resize.json
              python scripts/pump_amm_reserved_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-reserved.json
              python scripts/pump_amm_accumulator_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-accumulator.json
              python scripts/pump_amm_liquidity_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-liquidity.json
              python scripts/pump_amm_trade_v2_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-trade-v2.json
              python scripts/pump_amm_create_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-create.json
              python scripts/pump_amm_migration_create_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-migration-create.json
              python scripts/pump_amm_boost_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-boost.json
              python scripts/pump_amm_sweep_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-sweep.json
              python scripts/pump_amm_extend_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-extend.json
              python scripts/pump_amm_collect_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-collect.json
              python scripts/pump_amm_transfer_creator_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-transfer-creator.json
              python scripts/pump_amm_creator_reassignment_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-creator-reassignment.json
              python scripts/pump_amm_creator_reassignment_cto_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-creator-reassignment-cto.json
              python scripts/pump_amm_incentives_differential.py --family sync --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-incentives-sync.json
              python scripts/pump_amm_incentives_differential.py --family admin --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-incentives-admin.json
              python scripts/pump_amm_incentives_differential.py --family claim --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-incentives-claim.json
              python scripts/pump_amm_cashback_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-cashback.json
              python scripts/pump_amm_legacy_sell_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-legacy-sell.json
              python scripts/pump_amm_legacy_buy_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-legacy-buy.json
              python scripts/pump_amm_boost_burn_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-boost-burn.json
              python scripts/pump_amm_multi_hop_differential.py --candidate repro/pump_amm/claim-context-main-v144/main/candidate.so --output work/pump-amm-multi-hop.json
              python repro/pump_amm/claim-context-main-v144/verify.py --current-main .
          - suite: mayhem-1
            commands: |
              python repro/mayhem/sell-result-error-main-twentyfour/verify.py --current-main .
              python scripts/mayhem_validate_admin.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-admin.json
              python scripts/mayhem_validate_fee_recipient.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-recipient.json
              python scripts/mayhem_buy_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twenty/buy-cases.json --output work/mayhem-buy.json
              python scripts/verify_mayhem_buy.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy.json --output work/mayhem-buy-verification.json
              python scripts/mayhem_sell_v2_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyone/sell-v2-cases.json --family token22 --output work/mayhem-sell-v2-token22.json
              python scripts/verify_mayhem_sell_v2.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell-v2-token22.json --output work/mayhem-sell-v2-token22-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyfour/buy-pump-swap-cases.json --instruction buy_pump_swap --family token22 --output work/mayhem-buy-pump-swap-token22.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy-pump-swap-token22.json --output work/mayhem-buy-pump-swap-token22-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyfour/sell-pump-swap-cases.json --instruction sell_pump_swap --family token22 --output work/mayhem-sell-pump-swap-token22.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell-pump-swap-token22.json --output work/mayhem-sell-pump-swap-token22-verification.json
              mkdir -p work/mayhem-captured-fixtures
              python -c "import tarfile; tarfile.open('repro/mayhem/twentyfour/captured-fixtures.tar.gz').extractall('work/mayhem-captured-fixtures', filter='data')"
              python work/mayhem-captured-fixtures/verify_fixtures.py
              python scripts/mayhem_burn_sequence.py --fixtures work/mayhem-captured-fixtures --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-burn-replay
              python scripts/verify_mayhem_burn_sequence.py --fixtures work/mayhem-captured-fixtures --receipts work/mayhem-burn-replay
          - suite: mayhem-2
            commands: |
              python scripts/mayhem_validate_withdraw.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-withdraw.json
              python scripts/mayhem_validate_quote_withdraw.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-quote-withdraw.json
              python scripts/mayhem_validate_sweeps.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-sweeps.json
              python scripts/mayhem_sell_v2_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyone/sell-v2-cases.json --family token --output work/mayhem-sell-v2-token.json
              python scripts/verify_mayhem_sell_v2.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell-v2-token.json --output work/mayhem-sell-v2-token-verification.json
              python scripts/mayhem_buy_v2_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentytwo/buy-v2-cases.json --family token22 --output work/mayhem-buy-v2-token22.json
              python scripts/verify_mayhem_buy_v2.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy-v2-token22.json --output work/mayhem-buy-v2-token22-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyfour/buy-pump-swap-cases.json --instruction buy_pump_swap --family token --output work/mayhem-buy-pump-swap-token.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy-pump-swap-token.json --output work/mayhem-buy-pump-swap-token-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyfour/sell-pump-swap-cases.json --instruction sell_pump_swap --family token --output work/mayhem-sell-pump-swap-token.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell-pump-swap-token.json --output work/mayhem-sell-pump-swap-token-verification.json
          - suite: mayhem-3
            commands: |
              python scripts/mayhem_validate_extend.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-extend.json
              python scripts/mayhem_sell_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --output work/mayhem-sell.json
              python scripts/verify_mayhem_sell.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell.json --output work/mayhem-sell-verification.json
              python scripts/mayhem_sell_v2_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyone/sell-v2-cases.json --family native --output work/mayhem-sell-v2-native.json
              python scripts/verify_mayhem_sell_v2.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell-v2-native.json --output work/mayhem-sell-v2-native-verification.json
              python scripts/mayhem_buy_v2_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentytwo/buy-v2-cases.json --family native --output work/mayhem-buy-v2-native.json
              python scripts/verify_mayhem_buy_v2.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy-v2-native.json --output work/mayhem-buy-v2-native-verification.json
              python scripts/mayhem_buy_v2_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentytwo/buy-v2-cases.json --family token --output work/mayhem-buy-v2-token.json
              python scripts/verify_mayhem_buy_v2.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy-v2-token.json --output work/mayhem-buy-v2-token-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyfour/buy-pump-swap-cases.json --instruction buy_pump_swap --family native --output work/mayhem-buy-pump-swap-native.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-buy-pump-swap-native.json --output work/mayhem-buy-pump-swap-native-verification.json
              python scripts/mayhem_pump_swap_differential.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --cases repro/mayhem/twentyfour/sell-pump-swap-cases.json --instruction sell_pump_swap --family native --output work/mayhem-sell-pump-swap-native.json
              python scripts/verify_mayhem_pump_swap.py --candidate repro/mayhem/sell-result-error-main-twentyfour/main/candidate.so --receipts work/mayhem-sell-pump-swap-native.json --output work/mayhem-sell-pump-swap-native-verification.json
          - suite: imported-lab
            commands: |
              git clone https://github.com/pump-fun/pump-public-docs.git work/pump-public-docs
              python scripts/verify_imported_lab.py --docs-checkout work/pump-public-docs --output work/lab-saved-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdir -p work
      - name: Run bounded validation suites
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite }}
          path: |
            work/*.json
            work/*.json.gz
            work/mayhem-burn-replay/**
            work/merged-replay/**
            work/merged-extended/**
          if-no-files-found: ignore
