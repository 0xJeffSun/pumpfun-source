name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - suite: evidence
            commands: |
              python scripts/verify_evidence.py
              python scripts/test_tooling.py
              python scripts/test_build_source_manifest.py
              python scripts/verify_recovered_builds.py
              python scripts/pump_verify_dependencies.py
              python scripts/local_validation.py
              git diff --exit-code -- audit/local-validation.json
          - suite: host-fragments
            commands: |
              mkdir -p work && rustc --edition 2021 -O programs/pump-fees/recovered/fee_selection_host.rs -o work/fee-selector-host
              python scripts/validate_fee_selection.py --host work/fee-selector-host --output work/fee-selector-validation.json
              python scripts/build_quote_host.py --output work/quote-host
              python scripts/validate_quote_fees.py --host work/quote-host/quote-fees-host --output work/quote-validation.json
              rustc --edition=2021 -O programs/pump/recovered/constant_product_host.rs -o work/pump-math-host
              python scripts/pump_validate_constant_product.py --host work/pump-math-host --output work/pump-math.json
              rustc --edition=2021 -O programs/pump/recovered/sell_accounting_host.rs -o work/pump-sell-accounting-host
              python scripts/pump_validate_sell_accounting.py --host work/pump-sell-accounting-host --output work/pump-sell-accounting.json
          - suite: fees
            commands: |
              python scripts/fees_validate_all.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fee-handlers.json
              python scripts/fees_donation_sequence.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/donation-sequence.json
              python repro/pump_fees/initializer-history/replay_history.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-init-history.json
              python repro/pump_fees/initializer-history/negative_differential.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-init-rejections.json
              python scripts/fees_error_messages_differential.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-error-messages.json
              python scripts/fees_external_codec_differential.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-codec-rejections.json
              python repro/pump_fees/update-admin-dataflow-v144/compared_values.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-compared-values.json
              python repro/pump_fees/update-admin-dataflow-v144/authority_logs.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-authority-logs.json
              python repro/pump_fees/update-admin-dataflow-v144/signed_transfers.py --candidate repro/pump_fees/update-admin-dataflow-v144/pump_fees_candidate.so --output work/fees-signed-transfers.json
              python repro/pump_fees/update-admin-dataflow-v144/verify_publication.py
          - suite: pump
            commands: |
              python scripts/pump_validate_all.py --candidate repro/pump/creator-thirtythree/candidate.so --output work/pump-handlers.json.gz
          - suite: pump-amm
            commands: |
              python scripts/pump_amm_admin_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-admin.json
              python scripts/pump_amm_buyback_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-buyback.json
              python scripts/pump_amm_fee_config_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-fee_config.json
              python scripts/pump_amm_resize_differential.py --creator --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-resize.json
              python scripts/pump_amm_reserved_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-reserved.json
              python scripts/pump_amm_accumulator_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-accumulator.json
              python scripts/pump_amm_liquidity_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-liquidity.json
              python scripts/pump_amm_trade_v2_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-trade-v2.json
              python scripts/pump_amm_create_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-create.json
              python scripts/pump_amm_migration_create_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-migration-create.json
              python scripts/pump_amm_boost_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-boost.json
              python scripts/pump_amm_sweep_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-sweep.json
              python scripts/pump_amm_extend_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-extend.json
              python scripts/pump_amm_collect_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-collect.json
              python scripts/pump_amm_transfer_creator_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-transfer-creator.json
              python scripts/pump_amm_creator_reassignment_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-creator-reassignment.json
              python scripts/pump_amm_creator_reassignment_cto_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-creator-reassignment-cto.json
              python scripts/pump_amm_incentives_differential.py --family sync --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-incentives-sync.json
              python scripts/pump_amm_incentives_differential.py --family admin --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-incentives-admin.json
              python scripts/pump_amm_incentives_differential.py --family claim --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-incentives-claim.json
              python scripts/pump_amm_cashback_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-cashback.json
              python scripts/pump_amm_legacy_sell_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-legacy-sell.json
              python scripts/pump_amm_legacy_buy_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-legacy-buy.json
              python scripts/pump_amm_boost_burn_differential.py --candidate repro/pump_amm/boost-burn-thirty-six/pump_amm_recovered.so --output work/pump-amm-boost-burn.json
          - suite: mayhem
            commands: |
              python scripts/mayhem_validate_admin.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-admin.json
              python scripts/mayhem_validate_fee_recipient.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-recipient.json
              python scripts/mayhem_validate_extend.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-extend.json
              python scripts/mayhem_validate_withdraw.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-withdraw.json
              python scripts/mayhem_validate_quote_withdraw.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-quote-withdraw.json
              python scripts/mayhem_validate_sweeps.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-sweeps.json
              python scripts/mayhem_sell_differential.py --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-sell.json
              python scripts/verify_mayhem_sell.py --candidate repro/mayhem/twenty/mayhem_recovered.so --receipts work/mayhem-sell.json --output work/mayhem-sell-verification.json
              python scripts/mayhem_buy_differential.py --candidate repro/mayhem/twenty/mayhem_recovered.so --cases repro/mayhem/twenty/buy-cases.json --output work/mayhem-buy.json
              python scripts/verify_mayhem_buy.py --candidate repro/mayhem/twenty/mayhem_recovered.so --receipts work/mayhem-buy.json --output work/mayhem-buy-verification.json
              mkdir -p work/mayhem-captured-fixtures
              python -c "import tarfile; tarfile.open('repro/mayhem/twenty/captured-fixtures.tar.gz').extractall('work/mayhem-captured-fixtures', filter='data')"
              python work/mayhem-captured-fixtures/verify_fixtures.py
              python scripts/mayhem_burn_sequence.py --fixtures work/mayhem-captured-fixtures --candidate repro/mayhem/twenty/mayhem_recovered.so --output work/mayhem-burn-replay
              python scripts/verify_mayhem_burn_sequence.py --fixtures work/mayhem-captured-fixtures --receipts work/mayhem-burn-replay
          - suite: imported-lab
            commands: |
              git clone https://github.com/pump-fun/pump-public-docs.git work/pump-public-docs
              python scripts/verify_imported_lab.py --docs-checkout work/pump-public-docs --output work/lab-saved-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdir -p work
      - name: Run bounded validation suites
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite }}
          path: |
            work/*.json
            work/*.json.gz
            work/mayhem-burn-replay/**
          if-no-files-found: ignore
