name: Measure frozen selected Relay13 with official Linux v1.48
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay13-linux-v148-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Source-only dry plan
        run: >-
          python3 -B scripts/measure_relay13_linux_v148.py
          --repo "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/relay13-linux-v148" --dry-run
      - name: One explicit controlled compiler measurement
        run: >-
          python3 -B scripts/measure_relay13_linux_v148.py
          --repo "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/relay13-linux-v148" --execute
      - name: Retain publication evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay13-linux-v148-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relay13-linux-v148/publication/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
