name: One authorized frozen Source15 Linux v1.48 measurement
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact frozen Source15 commit authorized by root
        required: true
        type: string
      measurement_nonce:
        description: Fresh root-issued 64-character lowercase hex nonce; one dispatch only
        required: true
        type: string
      authority_base64:
        description: Exact root-reviewed authorization JSON bytes encoded as base64
        required: true
        type: string
      authority_sha256:
        description: SHA256 of exact decoded authorization JSON bytes
        required: true
        type: string
      controller_manifest_sha256:
        description: Root-reviewed installed controller package manifest SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: relay15-linux-v148-${{ inputs.measurement_nonce }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      MEASUREMENT_NONCE: ${{ inputs.measurement_nonce }}
      AUTHORITY_BASE64: ${{ inputs.authority_base64 }}
      AUTHORITY_SHA256: ${{ inputs.authority_sha256 }}
      CONTROLLER_MANIFEST_SHA256: ${{ inputs.controller_manifest_sha256 }}
      CONTROLLER_PATH: repro/donation-relay/linux15-v148-one-shot-controller
    steps:
      - name: Check out exact controller and workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out frozen Source15 independently
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          path: source-checkout
          persist-credentials: false
      - name: Materialize exact authority bytes without execution
        shell: bash
        run: |
          python3 -B - <<'PY'
          import base64, hashlib, os, pathlib, re
          for key in ['MEASUREMENT_NONCE', 'AUTHORITY_SHA256', 'CONTROLLER_MANIFEST_SHA256']:
              assert re.fullmatch('[0-9a-f]{64}', os.environ[key]), key
          assert os.environ['SOURCE_COMMIT'] == '576889cbfb2e28d5b1c2f47f1488c0caa80b88b7'
          raw = base64.b64decode(os.environ['AUTHORITY_BASE64'], validate=True)
          assert hashlib.sha256(raw).hexdigest() == os.environ['AUTHORITY_SHA256']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / ('relay15-authority-' + os.environ['MEASUREMENT_NONCE'] + '.json')
          with path.open('xb') as f:
              f.write(raw)
          PY
      - name: One root-authorized controller attempt
        shell: bash
        run: >-
          python3 -B "$GITHUB_WORKSPACE/control/$CONTROLLER_PATH/controller.py"
          --control-repo "$GITHUB_WORKSPACE/control"
          --source-repo "$GITHUB_WORKSPACE/source-checkout"
          --output "$RUNNER_TEMP/relay15-linux-v148-$MEASUREMENT_NONCE"
          --authority "$RUNNER_TEMP/relay15-authority-$MEASUREMENT_NONCE.json"
          --authority-sha256 "$AUTHORITY_SHA256"
          --measurement-nonce "$MEASUREMENT_NONCE"
          --controller-manifest-sha256 "$CONTROLLER_MANIFEST_SHA256"
          --source-commit "$SOURCE_COMMIT"
      - name: Retain complete evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay15-linux-v148-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relay15-linux-v148-${{ inputs.measurement_nonce }}/publication/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
