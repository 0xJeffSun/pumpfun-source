# Run from /app: docker compose -f infra/compose.yaml up --build
services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: backend
    ports:
      - "127.0.0.1:3001:3001"
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: frontend
      args:
        BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
